<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админка — контур</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <section class="login-panel" id="login-panel">
        <a class="admin-logo" href="index.html">контур<span>.</span></a>
        <p class="admin-kicker">/ staff area</p>
        <h1>Заявки<br /><em>команды.</em></h1>
        <form id="login-form">
          <label>Пароль сотрудника<input id="password" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Войти <span>↗</span></button>
          <p class="login-status" role="status"></p>
        </form>
      </section>
      <section class="inbox" id="inbox" hidden>
        <header class="inbox-header"><div><p class="admin-kicker">/ kontur studio</p><h1>Входящие</h1></div><button class="logout" id="logout">Выйти</button></header>
        <div class="inbox-toolbar"><span id="lead-count">0 заявок</span><button id="refresh">Обновить ↻</button></div>
        <div class="lead-list" id="lead-list"></div>
      </section>
    </main>
    <script src="admin.js"></script>
  </body>
</html>
